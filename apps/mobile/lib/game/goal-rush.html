<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Goal Rush</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0f0a1e; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; overscroll-behavior: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px 16px; background: radial-gradient(circle at 50% 20%, #4c1d95 0%, #1e1b4b 55%, #0f0a1e 100%); z-index: 5; text-align: center; }
  .hidden { display: none !important; }
  h1 { margin: 0; font-size: 44px; font-weight: 900; letter-spacing: 1px; background: linear-gradient(90deg, #facc15, #f97316, #ec4899); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 4px 24px rgba(236,72,153,.35); }
  .sub { margin: -8px 0 0; color: #c4b5fd; font-size: 15px; }
  .cards { display: flex; gap: 10px; width: 100%; max-width: 440px; }
  .card { flex: 1; background: rgba(255,255,255,.07); border: 2px solid rgba(255,255,255,.12); border-radius: 18px; padding: 12px 6px; cursor: pointer; transition: transform .12s, border-color .12s; }
  .card.sel { border-color: #facc15; background: rgba(250,204,21,.12); transform: translateY(-4px); }
  .card canvas { position: static; width: 64px; height: 64px; }
  .card b { display: block; font-size: 17px; margin-top: 4px; }
  .card small { display: block; color: #c4b5fd; font-size: 11px; margin-top: 4px; line-height: 1.35; }
  .stats { font-size: 11px; color: #e9d5ff; margin-top: 6px; line-height: 1.5; }
  .btn { border: 0; border-radius: 999px; padding: 15px 44px; font-size: 20px; font-weight: 800; color: #1e1b4b; background: linear-gradient(180deg, #fde047, #f59e0b); box-shadow: 0 6px 0 #b45309, 0 10px 24px rgba(245,158,11,.35); cursor: pointer; font-family: inherit; }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #b45309; }
  .btn.ghost { background: rgba(255,255,255,.1); color: #fff; box-shadow: none; font-size: 15px; padding: 10px 28px; }
  .help { max-width: 380px; font-size: 13px; color: #ddd6fe; line-height: 1.6; background: rgba(0,0,0,.25); border-radius: 14px; padding: 10px 14px; }
  .big { font-size: 54px; font-weight: 900; margin: 0; }
  .score { font-size: 30px; font-weight: 800; }
  #exitBtn { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 8px); left: 10px; z-index: 4; width: 38px; height: 38px; border-radius: 50%; border: 0; background: rgba(0,0,0,.4); color: #fff; font-size: 18px; cursor: pointer; }
  #menuExit { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 10px); left: 12px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="exitBtn" class="hidden" aria-label="pause">II</button>

<div id="menu" class="screen">
  <button id="menuExit" class="btn ghost">✕</button>
  <h1>GOAL RUSH</h1>
  <p class="sub">כדורגל 3 נגד 3 · ראשון ל־2 שערים מנצח</p>
  <div class="cards" id="cards"></div>
  <button class="btn" id="playBtn">שחק ⚽</button>
  <div class="help">
    🕹️ גרור באצבע בצד שמאל כדי לזוז<br>
    🔴 כפתור אדום: יורה על יריבים, או בועט כשהכדור אצלך (גרור כדי לכוון)<br>
    ⭐ כפתור צהוב (סופר): נטען מפגיעות. עם כדור: בעיטת־על. בלי כדור: הסתערות<br>
    💡 תיכנס עם הכדור לשער או בעט פנימה!
  </div>
</div>

<div id="pause" class="screen hidden">
  <p class="big">⏸</p>
  <button class="btn" id="resumeBtn">המשך</button>
  <button class="btn ghost" id="quitBtn">חזרה לתפריט</button>
</div>

<div id="over" class="screen hidden">
  <p class="big" id="overTitle">ניצחון!</p>
  <p class="score" id="overScore" dir="ltr">2 - 0</p>
  <p class="sub" id="overStats"></p>
  <button class="btn" id="againBtn">שוב!</button>
  <button class="btn ghost" id="menuBtn">תפריט</button>
</div>

<script>
(function () {
  'use strict';

  // ---------- Constants ----------
  var W = 600, H = 1000;              // field size (world units)
  var GOAL_W = 170, GX0 = (W - GOAL_W) / 2, GX1 = GX0 + GOAL_W, GOAL_D = 46;
  var MATCH_TIME = 120, WIN_GOALS = 2;
  var TEAM_COLORS = [{ main: '#3b82f6', dark: '#1d4ed8', light: '#93c5fd' }, { main: '#ef4444', dark: '#b91c1c', light: '#fca5a5' }];

  var TYPES = {
    blitz: { name: 'ברק', desc: 'מהיר וזריז', hp: 3200, speed: 240, dmg: 650, pellets: 1, spread: 0, range: 380, bspeed: 950, reload: 1.0, accent: '#facc15' },
    rocky: { name: 'סלע', desc: 'טנק חזק, ירי צרור', hp: 5200, speed: 185, dmg: 420, pellets: 3, spread: 0.22, range: 270, bspeed: 780, reload: 1.4, accent: '#a3a3a3' },
    nova:  { name: 'נובה', desc: 'צלפית לטווח ארוך', hp: 3000, speed: 205, dmg: 1050, pellets: 1, spread: 0, range: 540, bspeed: 1150, reload: 1.5, accent: '#e879f9' }
  };
  var TYPE_KEYS = ['blitz', 'rocky', 'nova'];

  var OBSTACLES = [
    { x: 110, y: 290, w: 110, h: 38 }, { x: 380, y: 290, w: 110, h: 38 },
    { x: 110, y: 672, w: 110, h: 38 }, { x: 380, y: 672, w: 110, h: 38 },
    { x: 0,   y: 480, w: 70,  h: 40 }, { x: 530, y: 480, w: 70,  h: 40 },
    { x: 278, y: 150, w: 44,  h: 44 }, { x: 278, y: 806, w: 44,  h: 44 }
  ];

  // ---------- Canvas ----------
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var DPR = 1, CW = 0, CH = 0, scale = 1, offX = 0, offY = 0;
  var safeTop = 0;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    CW = window.innerWidth; CH = window.innerHeight;
    cv.width = Math.round(CW * DPR); cv.height = Math.round(CH * DPR);
    var hudTop = 64, bottomPad = Math.min(110, CH * 0.13);
    var vw = W + 30, vh = H + GOAL_D * 2 + 20;
    scale = Math.min(CW / vw, (CH - hudTop - bottomPad) / vh);
    offX = (CW - W * scale) / 2;
    offY = hudTop + ((CH - hudTop - bottomPad) - H * scale) / 2;
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Audio ----------
  var actx = null;
  function beep(freq, dur, type, vol) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'square'; o.frequency.value = freq;
      g.gain.setValueAtTime(vol || 0.05, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) { /* audio optional */ }
  }
  function vibrate(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

  // ---------- Helpers ----------
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function len(x, y) { return Math.sqrt(x * x + y * y); }
  function dist(a, b) { return len(a.x - b.x, a.y - b.y); }
  function norm(x, y) { var l = len(x, y) || 1; return { x: x / l, y: y / l }; }
  function rand(a, b) { return a + Math.random() * (b - a); }

  // push circle out of rect; returns collision normal or null
  function circleRect(o, r, rect) {
    var cx = clamp(o.x, rect.x, rect.x + rect.w), cy = clamp(o.y, rect.y, rect.y + rect.h);
    var dx = o.x - cx, dy = o.y - cy, d = len(dx, dy);
    if (d >= r) return null;
    if (d === 0) {
      var l = o.x - rect.x, rr = rect.x + rect.w - o.x, t = o.y - rect.y, b = rect.y + rect.h - o.y;
      var m = Math.min(l, rr, t, b);
      if (m === l) { o.x = rect.x - r; return { x: -1, y: 0 }; }
      if (m === rr) { o.x = rect.x + rect.w + r; return { x: 1, y: 0 }; }
      if (m === t) { o.y = rect.y - r; return { x: 0, y: -1 }; }
      o.y = rect.y + rect.h + r; return { x: 0, y: 1 };
    }
    var nx = dx / d, ny = dy / d;
    o.x = cx + nx * r; o.y = cy + ny * r;
    return { x: nx, y: ny };
  }
  function pointInRect(x, y, rect) { return x >= rect.x && x <= rect.x + rect.w && y >= rect.y && y <= rect.y + rect.h; }

  // ---------- Game state ----------
  var state = 'menu';
  var chosen = 'blitz';
  var players = [], bullets = [], particles = [], floaters = [];
  var ball, score, timeLeft, suddenDeath, pauseTimer, banner, bannerTime, shake, kickoffTeam;
  var me = null;
  var stats = { goals: 0, kos: 0 };

  function spawnPos(team, slot) {
    var xs = [300, 140, 460];
    var y = team === 0 ? [800, 880, 880][slot] : [200, 120, 120][slot];
    return { x: xs[slot], y: y };
  }

  function makePlayer(team, slot, type, isMe) {
    var t = TYPES[type];
    var p = {
      team: team, slot: slot, type: type, t: t, isMe: !!isMe,
      x: 0, y: 0, vx: 0, vy: 0, r: 22,
      hp: t.hp, alive: true, respawn: 0, lastHit: -10,
      ammo: 3, reloadT: 0, shotCd: 0, superC: 0,
      fx: 0, fy: team === 0 ? -1 : 1,
      dash: 0, dashX: 0, dashY: 0, dashHit: [],
      holdT: 0, stealCd: 0, flash: 0, walk: Math.random() * 6,
      role: slot === 0 ? 'attack' : (slot === 1 ? 'support' : 'defend'),
      think: 0, wobble: rand(-1, 1)
    };
    var s = spawnPos(team, slot); p.x = s.x; p.y = s.y;
    return p;
  }

  function newMatch() {
    players = [];
    for (var team = 0; team < 2; team++) {
      for (var s = 0; s < 3; s++) {
        var isMe = team === 0 && s === 0;
        var type = isMe ? chosen : TYPE_KEYS[Math.floor(Math.random() * 3)];
        players.push(makePlayer(team, s, type, isMe));
      }
    }
    me = players[0];
    score = [0, 0]; timeLeft = MATCH_TIME; suddenDeath = false;
    stats = { goals: 0, kos: 0 };
    kickoffTeam = -1;
    resetPositions();
    showBanner('קיק־אוף!', 1.2);
  }

  function resetPositions() {
    bullets = [];
    for (var i = 0; i < players.length; i++) {
      var p = players[i], s = spawnPos(p.team, p.slot);
      p.x = s.x; p.y = s.y; p.vx = p.vy = 0; p.alive = true; p.respawn = 0; p.hp = p.t.hp;
      p.ammo = 3; p.dash = 0; p.fx = 0; p.fy = p.team === 0 ? -1 : 1; p.holdT = 0;
    }
    ball = { x: W / 2, y: H / 2, vx: 0, vy: 0, r: 15, owner: null, noPick: 0, pierce: 0, spin: 0, lastKick: null, lastTeam: -1 };
    pauseTimer = 1.2;
  }

  function showBanner(text, t) { banner = text; bannerTime = t; }

  // ---------- Input ----------
  var input = { mx: 0, my: 0, joy: null, atk: null, sup: null, keys: {} };

  function btnLayout() {
    var r = Math.max(34, Math.min(46, CW * 0.11));
    var safeB = 18;
    return {
      atk: { x: CW - r - 22, y: CH - r - safeB - 10, r: r },
      sup: { x: CW - r * 2.9 - 22, y: CH - r * 0.75 - safeB - 4, r: r * 0.78 }
    };
  }

  function onDown(e) {
    if (state !== 'play') return;
    e.preventDefault();
    var x = e.clientX, y = e.clientY, b = btnLayout();
    if (len(x - b.atk.x, y - b.atk.y) < b.atk.r * 1.35 && !input.atk) {
      input.atk = { id: e.pointerId, sx: b.atk.x, sy: b.atk.y, x: x, y: y, aim: false };
    } else if (len(x - b.sup.x, y - b.sup.y) < b.sup.r * 1.4 && !input.sup) {
      input.sup = { id: e.pointerId, sx: b.sup.x, sy: b.sup.y, x: x, y: y, aim: false };
    } else if (x < CW * 0.6 && !input.joy) {
      input.joy = { id: e.pointerId, sx: x, sy: y, x: x, y: y };
    }
  }
  function onMove(e) {
    if (state !== 'play') return;
    var x = e.clientX, y = e.clientY;
    var j = input.joy;
    if (j && j.id === e.pointerId) { j.x = x; j.y = y; }
    var list = [input.atk, input.sup];
    for (var i = 0; i < 2; i++) {
      var a = list[i];
      if (a && a.id === e.pointerId) { a.x = x; a.y = y; if (len(x - a.sx, y - a.sy) > 22) a.aim = true; }
    }
  }
  function onUp(e) {
    var j = input.joy;
    if (j && j.id === e.pointerId) input.joy = null;
    if (input.atk && input.atk.id === e.pointerId) { fireFromButton(input.atk, false); input.atk = null; }
    if (input.sup && input.sup.id === e.pointerId) { fireFromButton(input.sup, true); input.sup = null; }
  }
  function aimFromBtn(a) {
    if (!a.aim) return null;
    // screen direction == world direction (no rotation)
    return norm(a.x - a.sx, a.y - a.sy);
  }
  function fireFromButton(a, isSuper) {
    if (state !== 'play' || !me.alive) return;
    var dir = aimFromBtn(a);
    if (isSuper) doSuper(me, dir); else doAttack(me, dir);
  }
  cv.addEventListener('pointerdown', onDown, { passive: false });
  window.addEventListener('pointermove', onMove, { passive: false });
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);

  window.addEventListener('keydown', function (e) {
    input.keys[e.key.toLowerCase()] = true;
    if (state !== 'play') return;
    if (e.key === ' ') { e.preventDefault(); doAttack(me, null); }
    if (e.key.toLowerCase() === 'e') doSuper(me, null);
    if (e.key === 'Escape') pauseGame();
  });
  window.addEventListener('keyup', function (e) { input.keys[e.key.toLowerCase()] = false; });

  function readMove() {
    var mx = 0, my = 0, k = input.keys;
    if (k['a'] || k['arrowleft']) mx -= 1;
    if (k['d'] || k['arrowright']) mx += 1;
    if (k['w'] || k['arrowup']) my -= 1;
    if (k['s'] || k['arrowdown']) my += 1;
    if (input.joy) {
      var dx = input.joy.x - input.joy.sx, dy = input.joy.y - input.joy.sy, l = len(dx, dy), maxR = 55;
      if (l > 8) { var m = Math.min(1, l / maxR); mx = dx / l * m; my = dy / l * m; }
      if (l > maxR) { input.joy.sx = input.joy.x - dx / l * maxR; input.joy.sy = input.joy.y - dy / l * maxR; }
    }
    var l2 = len(mx, my);
    if (l2 > 1) { mx /= l2; my /= l2; }
    return { x: mx, y: my };
  }

  // ---------- Actions ----------
  function enemyGoal(p) { return { x: W / 2, y: p.team === 0 ? -GOAL_D / 2 : H + GOAL_D / 2 }; }
  function ownGoal(p) { return { x: W / 2, y: p.team === 0 ? H : 0 }; }

  function nearestEnemy(p, maxD) {
    var best = null, bd = maxD || 1e9;
    for (var i = 0; i < players.length; i++) {
      var o = players[i];
      if (o.team === p.team || !o.alive) continue;
      var d = dist(p, o);
      if (d < bd) { bd = d; best = o; }
    }
    return best;
  }

  function kickBall(p, dir, power, isSuper) {
    ball.owner = null;
    ball.x = p.x + dir.x * (p.r + ball.r + 2); ball.y = p.y + dir.y * (p.r + ball.r + 2);
    ball.vx = dir.x * power; ball.vy = dir.y * power;
    ball.noPick = isSuper ? 0.55 : 0.22;
    ball.pierce = isSuper ? 0.6 : 0;
    ball.lastKick = p; ball.lastTeam = p.team;
    p.holdT = 0;
    beep(isSuper ? 180 : 260, 0.12, 'triangle', 0.08);
    burst(ball.x, ball.y, isSuper ? '#facc15' : '#ffffff', isSuper ? 18 : 7, isSuper ? 260 : 140);
  }

  function doAttack(p, dir) {
    if (!p.alive || p.dash > 0) return;
    if (ball.owner === p) {
      var d = dir;
      if (!d) {
        var g = enemyGoal(p);
        d = (p.isMe && (Math.abs(p.fx) + Math.abs(p.fy) > 0) && input.joy) ? { x: p.fx, y: p.fy } : norm(g.x - p.x, g.y - p.y);
      }
      kickBall(p, d, 820, false);
      return;
    }
    if (p.shotCd > 0 || p.ammo < 1) return;
    var aim = dir;
    if (!aim) {
      var e = nearestEnemy(p, p.t.range + 60);
      if (e) aim = norm(e.x - p.x, e.y - p.y);
      else aim = { x: p.fx, y: p.fy };
    }
    p.ammo -= 1; p.shotCd = 0.28;
    p.fx = aim.x; p.fy = aim.y;
    var base = Math.atan2(aim.y, aim.x);
    for (var i = 0; i < p.t.pellets; i++) {
      var a = base + (p.t.pellets > 1 ? (i - (p.t.pellets - 1) / 2) * p.t.spread : 0);
      bullets.push({ x: p.x + Math.cos(a) * p.r, y: p.y + Math.sin(a) * p.r, vx: Math.cos(a) * p.t.bspeed, vy: Math.sin(a) * p.t.bspeed,
        team: p.team, dmg: p.t.dmg, life: p.t.range / p.t.bspeed, owner: p, r: p.type === 'nova' ? 8 : 6, color: p.t.accent });
    }
    if (p.isMe || dist(p, me) < 400) beep(p.type === 'rocky' ? 140 : 520, 0.06, 'square', 0.025);
  }

  function doSuper(p, dir) {
    if (!p.alive || p.superC < 1 || p.dash > 0) return;
    p.superC = 0;
    if (ball.owner === p) {
      var g = enemyGoal(p);
      var d = dir || norm(g.x - p.x, g.y - p.y);
      kickBall(p, d, 1350, true);
      shake = 0.25;
      if (p.isMe) vibrate(30);
      return;
    }
    var d2 = dir;
    if (!d2) {
      var tgt = ball.owner && ball.owner.team !== p.team ? ball.owner : (ball.owner ? nearestEnemy(p) : ball);
      d2 = tgt ? norm(tgt.x - p.x, tgt.y - p.y) : { x: p.fx, y: p.fy };
    }
    p.dash = 0.32; p.dashX = d2.x; p.dashY = d2.y; p.dashHit = [];
    p.fx = d2.x; p.fy = d2.y;
    beep(110, 0.25, 'sawtooth', 0.06);
    if (p.isMe) vibrate(20);
  }

  function damage(target, amount, src) {
    if (!target.alive) return;
    target.hp -= amount; target.lastHit = now; target.flash = 0.12;
    floaters.push({ x: target.x + rand(-8, 8), y: target.y - 30, text: String(Math.round(amount)), t: 0.8, color: target.team === 0 ? '#fca5a5' : '#fde68a' });
    if (src) src.superC = Math.min(1, src.superC + 0.18);
    if (target.hp <= 0) knockout(target, src);
  }

  function knockout(p, src) {
    p.alive = false; p.respawn = 3; p.hp = 0; p.dash = 0;
    burst(p.x, p.y, TEAM_COLORS[p.team].main, 22, 220);
    if (ball.owner === p) { ball.owner = null; ball.vx = rand(-60, 60); ball.vy = rand(-60, 60); ball.noPick = 0.1; }
    if (src && src.isMe) { stats.kos++; showBanner('הפלת יריב!', 0.9); }
    if (p.isMe) { showBanner('הופלת! חוזר בעוד 3...', 1.2); vibrate(80); }
    beep(90, 0.3, 'sawtooth', 0.06);
  }

  // ---------- Particles ----------
  function burst(x, y, color, n, sp) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, s = rand(sp * 0.3, sp);
      particles.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: rand(0.3, 0.7), max: 0.7, color: color, r: rand(2, 5) });
    }
  }

  // ---------- AI ----------
  function teammates(p) { return players.filter(function (o) { return o.team === p.team && o.alive; }); }

  function botThink(p, dt) {
    var mv = { x: 0, y: 0 };
    if (!p.alive) return mv;
    var dirUp = p.team === 0 ? -1 : 1; // attack direction (y)
    var eg = enemyGoal(p), og = ownGoal(p);
    var carrier = ball.owner;

    // who on my team is closest to the ball
    var mates = teammates(p), closest = null, cd = 1e9;
    for (var i = 0; i < mates.length; i++) { var dd = dist(mates[i], ball); if (dd < cd && !mates[i].isMe) { cd = dd; closest = mates[i]; } }
    // human counts as a chaser too (so bots don't all crowd the ball)
    var humanChasing = p.team === me.team && me.alive && dist(me, ball) < cd * 0.9;

    var target = null;
    if (carrier === p) {
      // dribble towards goal, slight weave
      var gx = clamp(eg.x + p.wobble * 50, GX0 + 30, GX1 - 30);
      target = { x: gx, y: eg.y };
      var dGoal = len(eg.x - p.x, eg.y - p.y);
      var enemyNear = nearestEnemy(p, 85);
      if (p.superC >= 1 && dGoal < 520) { doSuper(p, aimAtGoal(p, 0.08)); return mv; }
      if (dGoal < 300 || (enemyNear && dGoal < 520) || (p.holdT > 3.2)) {
        p.think -= dt;
        if (p.think <= 0) { doAttack(p, aimAtGoal(p, 0.16)); p.think = 0.3; return mv; }
      }
      if (enemyNear && dGoal >= 520) {
        // try a pass to a mate further ahead
        var mate = null;
        for (var k = 0; k < mates.length; k++) { var m = mates[k]; if (m !== p && (m.y - p.y) * dirUp > 60) mate = m; }
        if (mate && Math.random() < 0.02) { doAttack(p, norm(mate.x - p.x, mate.y - p.y)); return mv; }
      }
    } else if (!carrier) {
      if (p === closest && !humanChasing) {
        // approach ball from behind (goal side)
        var behind = norm(ball.x - eg.x, ball.y - eg.y);
        var dB = dist(p, ball);
        target = dB > 70 ? { x: ball.x + behind.x * 26, y: ball.y + behind.y * 26 } : { x: ball.x, y: ball.y };
        // lead moving ball
        target.x += ball.vx * 0.25; target.y += ball.vy * 0.25;
      } else if (p.role === 'defend') {
        target = { x: (ball.x + og.x) / 2, y: og.y + (ball.y - og.y) * 0.35 };
      } else {
        target = { x: clamp(ball.x + (p.slot === 1 ? -130 : 130), 50, W - 50), y: ball.y + dirUp * 120 };
      }
    } else if (carrier.team === p.team) {
      // support attack: run ahead, spread out
      if (p.role === 'defend') target = { x: W / 2 + p.wobble * 80, y: H / 2 - dirUp * 60 };
      else target = { x: clamp(carrier.x + (p.x < carrier.x ? -150 : 150), 50, W - 50), y: carrier.y + dirUp * 170 };
    } else {
      // enemy has ball: chase or guard goal
      if (p.role === 'defend' && dist(carrier, og) > 260) target = { x: (carrier.x + og.x) / 2, y: og.y - dirUp * 140 };
      else target = { x: carrier.x + carrier.vx * 0.2, y: carrier.y + carrier.vy * 0.2 };
    }

    if (target) {
      var dx = target.x - p.x, dy = target.y - p.y, l = len(dx, dy);
      if (l > 12) { mv.x = dx / l; mv.y = dy / l; }
      // simple obstacle avoidance: look ahead
      var ax = p.x + mv.x * 40, ay = p.y + mv.y * 40;
      for (var o = 0; o < OBSTACLES.length; o++) {
        var r = OBSTACLES[o];
        if (pointInRect(ax, ay, { x: r.x - 18, y: r.y - 18, w: r.w + 36, h: r.h + 36 })) {
          var side = (p.x < r.x + r.w / 2) ? -1 : 1;
          mv.x = side; mv.y *= 0.4; var nm = norm(mv.x, mv.y); mv.x = nm.x; mv.y = nm.y;
          break;
        }
      }
    }

    // shooting at enemies
    if (carrier !== p) {
      var e = nearestEnemy(p, p.t.range * 0.95);
      if (e && p.ammo >= 1 && p.shotCd <= 0 && Math.random() < dt * (e === carrier ? 3.2 : 1.6)) {
        var tt = dist(p, e) / p.t.bspeed;
        var lx = e.x + e.vx * tt * 0.7, ly = e.y + e.vy * tt * 0.7;
        var a = Math.atan2(ly - p.y, lx - p.x) + rand(-0.12, 0.12);
        doAttack(p, { x: Math.cos(a), y: Math.sin(a) });
      }
      if (p.superC >= 1) {
        var en = nearestEnemy(p, 200);
        if ((carrier && carrier.team !== p.team && dist(p, carrier) < 230) || (en && Math.random() < dt * 0.5)) doSuper(p, null);
      }
    }
    return mv;
  }

  function aimAtGoal(p, err) {
    var eg = enemyGoal(p);
    var gx = rand(GX0 + 25, GX1 - 25);
    var a = Math.atan2(eg.y - p.y, gx - p.x) + rand(-err, err);
    return { x: Math.cos(a), y: Math.sin(a) };
  }

  // ---------- Update ----------
  var now = 0;

  function update(dt) {
    now += dt;
    if (bannerTime > 0) bannerTime -= dt;
    if (shake > 0) shake -= dt;

    updateParticles(dt);
    if (state !== 'play') return;

    if (pauseTimer > 0) { pauseTimer -= dt; return; }

    if (!suddenDeath) {
      timeLeft -= dt;
      if (timeLeft <= 0) {
        timeLeft = 0;
        if (score[0] !== score[1]) { endMatch(); return; }
        suddenDeath = true; showBanner('שער הזהב!', 1.6);
      }
    }

    var mvMe = readMove();

    for (var i = 0; i < players.length; i++) {
      var p = players[i];
      if (!p.alive) {
        p.respawn -= dt;
        if (p.respawn <= 0) {
          var s = spawnPos(p.team, p.slot);
          p.x = s.x; p.y = s.y; p.alive = true; p.hp = p.t.hp; p.ammo = 3; p.vx = p.vy = 0;
          burst(p.x, p.y, '#ffffff', 10, 120);
        }
        continue;
      }
      // reload ammo
      if (p.ammo < 3) { p.reloadT += dt; if (p.reloadT >= p.t.reload) { p.reloadT = 0; p.ammo++; } } else p.reloadT = 0;
      if (p.shotCd > 0) p.shotCd -= dt;
      if (p.stealCd > 0) p.stealCd -= dt;
      if (p.flash > 0) p.flash -= dt;
      // regen after 3s without damage
      if (now - p.lastHit > 3 && p.hp < p.t.hp) p.hp = Math.min(p.t.hp, p.hp + p.t.hp * 0.13 * dt);

      var mv = p.isMe ? mvMe : botThink(p, dt);
      var spd = p.t.speed * (ball.owner === p ? 0.9 : 1);

      if (p.dash > 0) {
        p.dash -= dt;
        p.vx = p.dashX * 720; p.vy = p.dashY * 720;
        for (var j = 0; j < players.length; j++) {
          var o = players[j];
          if (o.team === p.team || !o.alive || p.dashHit.indexOf(o) >= 0) continue;
          if (dist(p, o) < p.r + o.r + 6) {
            p.dashHit.push(o);
            var kn = norm(o.x - p.x, o.y - p.y);
            o.x += kn.x * 50; o.y += kn.y * 50;
            damage(o, 900, null);
            if (ball.owner === o) { ball.owner = null; ball.vx = kn.x * 300; ball.vy = kn.y * 300; ball.noPick = 0.15; }
            shake = 0.15;
          }
        }
      } else {
        var accel = 14;
        p.vx += (mv.x * spd - p.vx) * Math.min(1, accel * dt);
        p.vy += (mv.y * spd - p.vy) * Math.min(1, accel * dt);
      }
      if (Math.abs(mv.x) + Math.abs(mv.y) > 0.1 && p.dash <= 0) { var f = norm(mv.x, mv.y); p.fx = f.x; p.fy = f.y; }

      p.x += p.vx * dt; p.y += p.vy * dt;
      if (len(p.vx, p.vy) > 20) p.walk += dt * 12;

      // walls
      p.x = clamp(p.x, p.r, W - p.r); p.y = clamp(p.y, p.r, H - p.r);
      for (var k = 0; k < OBSTACLES.length; k++) circleRect(p, p.r, OBSTACLES[k]);
    }

    // player-player separation
    for (var a = 0; a < players.length; a++) {
      for (var b = a + 1; b < players.length; b++) {
        var A = players[a], B = players[b];
        if (!A.alive || !B.alive) continue;
        var dx = B.x - A.x, dy = B.y - A.y, d = len(dx, dy), md = A.r + B.r;
        if (d < md && d > 0) {
          var push = (md - d) / 2, nx = dx / d, ny = dy / d;
          A.x -= nx * push; A.y -= ny * push; B.x += nx * push; B.y += ny * push;
          // steal on contact
          if (A.team !== B.team) {
            if (ball.owner === A && A.holdT > 0.6 && B.stealCd <= 0) steal(B, A);
            else if (ball.owner === B && B.holdT > 0.6 && A.stealCd <= 0) steal(A, B);
          }
        }
      }
    }

    updateBullets(dt);
    updateBall(dt);
  }

  function steal(thief, victim) {
    ball.owner = thief; thief.holdT = 0; victim.stealCd = 0.9; victim.holdT = 0;
    burst(ball.x, ball.y, '#ffffff', 6, 100);
    beep(330, 0.06, 'triangle', 0.05);
  }

  function updateBullets(dt) {
    for (var i = bullets.length - 1; i >= 0; i--) {
      var b = bullets[i];
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      var dead = b.life <= 0 || b.x < 0 || b.x > W || b.y < 0 || b.y > H;
      for (var k = 0; !dead && k < OBSTACLES.length; k++) if (pointInRect(b.x, b.y, OBSTACLES[k])) dead = true;
      for (var j = 0; !dead && j < players.length; j++) {
        var p = players[j];
        if (p.team === b.team || !p.alive) continue;
        if (len(p.x - b.x, p.y - b.y) < p.r + b.r) {
          damage(p, b.dmg, b.owner);
          var kn = norm(b.vx, b.vy); p.vx += kn.x * 120; p.vy += kn.y * 120;
          burst(b.x, b.y, b.color, 5, 90);
          dead = true;
        }
      }
      if (dead) bullets.splice(i, 1);
    }
  }

  function updateBall(dt) {
    if (ball.noPick > 0) ball.noPick -= dt;
    if (ball.pierce > 0) ball.pierce -= dt;
    var o = ball.owner;
    if (o) {
      if (!o.alive) { ball.owner = null; }
      else {
        o.holdT += dt;
        var off = o.r + ball.r - 4;
        var tx = o.x + o.fx * off, ty = o.y + o.fy * off;
        ball.x += (tx - ball.x) * Math.min(1, 25 * dt);
        ball.y += (ty - ball.y) * Math.min(1, 25 * dt);
        ball.vx = o.vx; ball.vy = o.vy;
        ball.spin += len(o.vx, o.vy) * dt * 0.05;
        var inMouth = ball.x > GX0 + 4 && ball.x < GX1 - 4;
        if (!inMouth) ball.y = clamp(ball.y, ball.r, H - ball.r);
        ball.x = clamp(ball.x, ball.r, W - ball.r);
        for (var k0 = 0; k0 < OBSTACLES.length; k0++) circleRect(ball, ball.r, OBSTACLES[k0]);

    var sp = len(ball.vx, ball.vy);
    ball.x += ball.vx * dt; ball.y += ball.vy * dt;
    ball.spin += sp * dt * 0.05;
    var fr = Math.pow(0.42, dt);
    ball.vx *= fr; ball.vy *= fr;
    if (sp < 8) { ball.vx = ball.vy = 0; }

    var bounce = 0.72, r = ball.r;
    var inMouthX = ball.x > GX0 + r * 0.4 && ball.x < GX1 - r * 0.4;

      if (ball.x < GX0 + r) { ball.x = GX0 + r; ball.vx = Math.abs(ball.vx) * bounce; }
      if (ball.x > GX1 - r) { ball.x = GX1 - r; ball.vx = -Math.abs(ball.vx) * bounce; }
    } else {
      if (ball.x < r) { ball.x = r; ball.vx = Math.abs(ball.vx) * bounce; hitWall(); }
      if (ball.x > W - r) { ball.x = W - r; ball.vx = -Math.abs(ball.vx) * bounce; hitWall(); }
    }
    if (!inMouthX) {
      if (ball.y < r) { ball.y = r; ball.vy = Math.abs(ball.vy) * bounce; hitWall(); }
      if (ball.y > H - r) { ball.y = H - r; ball.vy = -Math.abs(ball.vy) * bounce; hitWall(); }
    }
    for (var k = 0; k < OBSTACLES.length; k++) {

      }

      var p = players[i];

      var d = dist(p, ball);
      if (d < p.r + r) {
        if (ball.pierce > 0) continue;
        if (ball.noPick <= 0 && p.stealCd <= 0) {
          ball.owner = p; p.holdT = 0;
          beep(400, 0.04, 'triangle', 0.03);
          break;
        } else if (ball.lastKick !== p) {
          var nn = norm(ball.x - p.x, ball.y - p.y);
          ball.x = p.x + nn.x * (p.r + r); ball.y = p.y + nn.y * (p.r + r);

          if (dd < 0) { ball.vx -= 1.6 * dd * nn.x; ball.vy -= 1.6 * dd * nn.y; }
        }
      }
    }
    checkGoal();
  }

  var lastWallBeep = 0;
  function hitWall() { if (now - lastWallBeep > 0.1 && len(ball.vx, ball.vy) > 150) { beep(200, 0.04, 'triangle', 0.025); lastWallBeep = now; } }

  function checkGoal() {
    if (ball.y < -ball.r * 0.6 && ball.x > GX0 && ball.x < GX1) goal(0);
    else if (ball.y > H + ball.r * 0.6 && ball.x > GX0 && ball.x < GX1) goal(1);
  }

  function goal(team) {
    score[team]++;
    var scorer = ball.lastKick;
    if (scorer && scorer.isMe && team === 0) stats.goals++;
    var y = team === 0 ? -GOAL_D / 2 : H + GOAL_D / 2;
    for (var i = 0; i < 4; i++) burst(rand(GX0, GX1), y, ['#facc15', '#ec4899', '#22d3ee', '#a3e635'][i], 20, 380);
    shake = 0.5;
    vibrate(team === 0 ? [40, 40, 80] : 120);
    if (team === 0) { beep(523, 0.15, 'square', 0.06); setTimeout(function () { beep(659, 0.15, 'square', 0.06); }, 140); setTimeout(function () { beep(784, 0.3, 'square', 0.06); }, 280); }
    else beep(150, 0.4, 'sawtooth', 0.06);

    if (score[team] >= WIN_GOALS || suddenDeath) {
      showBanner(team === 0 ? 'גוווול!!!' : 'היריב הבקיע', 1.6);
      ball.owner = null; ball.vx = ball.vy = 0; ball.y = team === 0 ? -200 : H + 200;
      state = 'ending';
      setTimeout(endMatch, 1600);
      return;
    }
    showBanner(team === 0 ? 'גוווול!!!' : 'היריב הבקיע', 1.8);
    ball.owner = null; ball.vx = ball.vy = 0; ball.x = -999; ball.y = -999;
    state = 'goal';
    setTimeout(function () { if (state === 'goal') { resetPositions(); state = 'play'; } }, 1900);
  }

  function endMatch() {
    state = 'over';
    var win = score[0] > score[1];
    document.getElementById('overTitle').textContent = win ? '🏆 ניצחון!' : (score[0] === score[1] ? 'תיקו' : '😢 הפסד');
    document.getElementById('overScore').textContent = score[0] + ' - ' + score[1];
    document.getElementById('overStats').textContent = 'שערים שלך: ' + stats.goals + ' · הפלות: ' + stats.kos;
    show('over');
    if (win) vibrate([60, 60, 60, 60, 160]);
  }

  function updateParticles(dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
      var q = particles[i];
      q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.92; q.vy *= 0.92; q.t -= dt;
      if (q.t <= 0) particles.splice(i, 1);
    }
    for (var j = floaters.length - 1; j >= 0; j--) {

    }
  }

  // ---------- Rendering ----------
  function W2S(x, y) { return { x: offX + x * scale, y: offY + y * scale }; }

  function drawField() {
    ctx.fillStyle = '#0f0a1e';
    ctx.fillRect(0, 0, CW, CH);
    ctx.save();
    ctx.translate(offX, offY); ctx.scale(scale, scale);
    if (shake > 0) ctx.translate(rand(-6, 6) * shake * 2, rand(-6, 6) * shake * 2);

    // outer border
    ctx.fillStyle = '#3b2a1a';
    roundRect(-14, -14, W + 28, H + 28, 18); ctx.fill();
    // goals (nets)
    for (var t = 0; t < 2; t++) {
      var gy = t === 0 ? -GOAL_D : H;
      ctx.fillStyle = TEAM_COLORS[t === 0 ? 1 : 0].dark;
      roundRect(GX0 - 8, gy - (t === 0 ? 8 : 0), GOAL_W + 16, GOAL_D + 8, 10); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.save(); ctx.beginPath(); ctx.rect(GX0, gy, GOAL_W, GOAL_D); ctx.clip();
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(GX0, gy, GOAL_W, GOAL_D);
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.5;
      for (var nx = GX0; nx <= GX1 + GOAL_D; nx += 12) { ctx.beginPath(); ctx.moveTo(nx, gy); ctx.lineTo(nx - GOAL_D, gy + GOAL_D); ctx.stroke(); ctx.beginPath(); ctx.moveTo(nx - GOAL_D, gy); ctx.lineTo(nx, gy + GOAL_D); ctx.stroke(); }
      ctx.restore();
    }
    // grass stripes
    for (var i = 0; i < 10; i++) {
      ctx.fillStyle = i % 2 ? '#4ade80' : '#22c55e';
      ctx.fillRect(0, i * H / 10, W, H / 10 + 1);
    }
    // lines
    ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 4;
    ctx.strokeRect(2, 2, W - 4, H - 4);
    ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(W / 2, H / 2, 80, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.beginPath(); ctx.arc(W / 2, H / 2, 6, 0, Math.PI * 2); ctx.fill();
    ctx.strokeRect(GX0 - 50, 2, GOAL_W + 100, 120);
    ctx.strokeRect(GX0 - 50, H - 122, GOAL_W + 100, 120);
    ctx.beginPath(); ctx.arc(W / 2, 122, 50, 0, Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.arc(W / 2, H - 122, 50, Math.PI, Math.PI * 2); ctx.stroke();
    // goal posts
    ctx.fillStyle = '#ffffff';
    [[GX0, 0], [GX1, 0], [GX0, H], [GX1, H]].forEach(function (pp) { ctx.beginPath(); ctx.arc(pp[0], pp[1], 7, 0, Math.PI * 2); ctx.fill(); });

    // obstacles (wooden crates)
    for (var k = 0; k < OBSTACLES.length; k++) {
      var r = OBSTACLES[k];

      ctx.fillStyle = '#b45309'; roundRect(r.x, r.y, r.w, r.h, 8); ctx.fill();
      ctx.fillStyle = '#d97706'; roundRect(r.x + 4, r.y + 4, r.w - 8, r.h - 12, 6); ctx.fill();
      ctx.strokeStyle = 'rgba(120,53,15,0.8)'; ctx.lineWidth = 2;
      for (var sx = r.x + 18; sx < r.x + r.w - 8; sx += 22) { ctx.beginPath(); ctx.moveTo(sx, r.y + 5); ctx.lineTo(sx, r.y + r.h - 9); ctx.stroke(); }
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function drawBrawler(c, p, x, y, sizeR, fx, fy, walk, flash) {
    var col = TEAM_COLORS[p.team], r = sizeR, bob = Math.sin(walk) * 2;
    // shadow
    c.fillStyle = 'rgba(0,0,0,0.25)';
    c.beginPath(); c.ellipse(x, y + r * 0.85, r * 0.9, r * 0.35, 0, 0, Math.PI * 2); c.fill();
    y += bob - 2;
    // feet
    c.fillStyle = '#1f2937';
    c.beginPath(); c.arc(x - r * 0.45, y + r * 0.8 + Math.sin(walk) * 3, r * 0.28, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(x + r * 0.45, y + r * 0.8 - Math.sin(walk) * 3, r * 0.28, 0, Math.PI * 2); c.fill();
    // body
    c.fillStyle = flash > 0 ? '#ffffff' : col.main;
    c.strokeStyle = '#111827'; c.lineWidth = 3;
    c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); c.stroke();
    // belly
    c.fillStyle = flash > 0 ? '#ffffff' : col.light;
    c.beginPath(); c.ellipse(x, y + r * 0.35, r * 0.55, r * 0.4, 0, 0, Math.PI * 2); c.fill();
    // type features
    var acc = p.t.accent;
    if (p.type === 'blitz') {
      c.fillStyle = acc; c.strokeStyle = '#111827'; c.lineWidth = 2.5;
      c.beginPath(); c.moveTo(x - r * 0.2, y - r * 1.55); c.lineTo(x + r * 0.35, y - r * 0.95); c.lineTo(x + r * 0.02, y - r * 0.95); c.lineTo(x + r * 0.25, y - r * 0.6); c.lineTo(x - r * 0.4, y - r * 1.1); c.lineTo(x - r * 0.08, y - r * 1.1); c.closePath(); c.fill(); c.stroke();
    } else if (p.type === 'rocky') {
      c.fillStyle = acc; c.strokeStyle = '#111827'; c.lineWidth = 2.5;
      for (var s = -1; s <= 1; s++) { c.beginPath(); c.moveTo(x + s * r * 0.5 - r * 0.22, y - r * 0.82); c.lineTo(x + s * r * 0.5, y - r * 1.35); c.lineTo(x + s * r * 0.5 + r * 0.22, y - r * 0.82); c.closePath(); c.fill(); c.stroke(); }
    } else {
      c.strokeStyle = '#111827'; c.lineWidth = 2.5;
      c.beginPath(); c.moveTo(x, y - r * 0.95); c.lineTo(x + r * 0.3, y - r * 1.5); c.stroke();
      c.fillStyle = acc; c.beginPath(); c.arc(x + r * 0.32, y - r * 1.55, r * 0.22, 0, Math.PI * 2); c.fill(); c.stroke();
    }
    // eyes looking at facing
    var ex = fx * r * 0.18, ey = fy * r * 0.12;
    for (var e = -1; e <= 1; e += 2) {
      c.fillStyle = '#ffffff'; c.beginPath(); c.ellipse(x + e * r * 0.32 + ex * 0.5, y - r * 0.2 + ey * 0.5, r * 0.22, r * 0.27, 0, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#111827'; c.beginPath(); c.arc(x + e * r * 0.32 + ex, y - r * 0.18 + ey, r * 0.11, 0, Math.PI * 2); c.fill();
    }
    // brows
    c.strokeStyle = '#111827'; c.lineWidth = 2.5;
    c.beginPath(); c.moveTo(x - r * 0.52, y - r * 0.52); c.lineTo(x - r * 0.14, y - r * 0.44); c.stroke();
    c.beginPath(); c.moveTo(x + r * 0.52, y - r * 0.52); c.lineTo(x + r * 0.14, y - r * 0.44); c.stroke();
  }

  function drawPlayers() {
    ctx.save();
    ctx.translate(offX, offY); ctx.scale(scale, scale);
    if (shake > 0) ctx.translate(rand(-6, 6) * shake * 2, rand(-6, 6) * shake * 2);

    // aim preview for me
    if (me && me.alive && state === 'play') {
      var a = input.atk && aimFromBtn(input.atk), sp = input.sup && aimFromBtn(input.sup);
      var dir = a || sp;
      if (dir) {
        var range = ball.owner === me ? 300 : (sp ? 160 : me.t.range);
        ctx.strokeStyle = sp ? 'rgba(250,204,21,0.8)' : 'rgba(255,255,255,0.7)';
        ctx.fillStyle = sp ? 'rgba(250,204,21,0.25)' : 'rgba(255,255,255,0.18)';
        ctx.lineWidth = 3;
        var px = -dir.y, py = dir.x, wdt = me.t.pellets > 1 && !sp && ball.owner !== me ? 40 : 14;
        ctx.beginPath();
        ctx.moveTo(me.x + px * 10, me.y + py * 10);
        ctx.lineTo(me.x + dir.x * range + px * wdt, me.y + dir.y * range + py * wdt);
        ctx.lineTo(me.x + dir.x * range - px * wdt, me.y + dir.y * range - py * wdt);
        ctx.lineTo(me.x - px * 10, me.y - py * 10);
        ctx.closePath(); ctx.fill(); ctx.stroke();
      }
    }

    // sort by y for depth
    var list = players.filter(function (p) { return p.alive; }).sort(function (a, b) { return a.y - b.y; });
    var ballDrawn = false;
    for (var i = 0; i < list.length; i++) {
      var p = list[i];
      if (!ballDrawn && ball.y < p.y) { drawBall(); ballDrawn = true; }
      if (p.isMe) {
        ctx.strokeStyle = '#facc15'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.ellipse(p.x, p.y + p.r * 0.85, p.r * 1.25, p.r * 0.5, 0, 0, Math.PI * 2); ctx.stroke();
      }
      if (p.superC >= 1) {
        ctx.fillStyle = 'rgba(250,204,21,' + (0.25 + 0.15 * Math.sin(now * 8)) + ')';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 1.45, 0, Math.PI * 2); ctx.fill();
      }
      if (p.dash > 0) { ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.arc(p.x - p.dashX * 20, p.y - p.dashY * 20, p.r, 0, Math.PI * 2); ctx.fill(); }
      drawBrawler(ctx, p, p.x, p.y, p.r, p.fx, p.fy, p.walk, p.flash);
      // HP bar
      var bw = 50, bh = 7, bx = p.x - bw / 2, by = p.y - p.r - 34;
      ctx.fillStyle = 'rgba(0,0,0,0.55)'; roundRect(bx - 2, by - 2, bw + 4, bh + 4, 4); ctx.fill();
      ctx.fillStyle = p.team === 0 ? (p.isMe ? '#4ade80' : '#60a5fa') : '#f87171';
      roundRect(bx, by, bw * Math.max(0, p.hp / p.t.hp), bh, 3); ctx.fill();
      ctx.font = 'bold 12px system-ui, sans-serif'; ctx.textAlign = 'center';
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.7)';
      var label = p.isMe ? 'אתה' : p.t.name;
      ctx.strokeText(label, p.x, by - 4); ctx.fillStyle = '#fff'; ctx.fillText(label, p.x, by - 4);
      // ammo for me
      if (p.isMe) {
        for (var k = 0; k < 3; k++) {
          var fill = k < p.ammo ? 1 : (k === p.ammo ? p.reloadT / p.t.reload : 0);
          ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(p.x - 25 + k * 17, p.y + p.r + 12, 15, 5);
          ctx.fillStyle = '#fb923c'; ctx.fillRect(p.x - 25 + k * 17, p.y + p.r + 12, 15 * fill, 5);
        }
      }
    }
    if (!ballDrawn) drawBall();

    // bullets
    for (var b = 0; b < bullets.length; b++) {
      var q = bullets[b];
      ctx.fillStyle = q.color; ctx.strokeStyle = TEAM_COLORS[q.team].dark; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
    // particles
    for (var pi = 0; pi < particles.length; pi++) {
      var pa = particles[pi];
      ctx.globalAlpha = Math.max(0, pa.t / pa.max);
      ctx.fillStyle = pa.color; ctx.beginPath(); ctx.arc(pa.x, pa.y, pa.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // floating damage numbers
    ctx.font = 'bold 15px system-ui, sans-serif'; ctx.textAlign = 'center';
    for (var fi = 0; fi < floaters.length; fi++) {
      var f = floaters[fi];
      ctx.globalAlpha = Math.min(1, f.t * 2);
      ctx.lineWidth = 3; ctx.strokeStyle = '#000'; ctx.strokeText(f.text, f.x, f.y);
      ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawBall() {
    if (ball.x < -500) return;
    var x = ball.x, y = ball.y, r = ball.r;
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(x + 2, y + r * 0.8, r, r * 0.4, 0, 0, Math.PI * 2); ctx.fill();
    if (ball.pierce > 0) { ctx.fillStyle = 'rgba(250,204,21,0.5)'; ctx.beginPath(); ctx.arc(x, y, r * 1.8, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#111827'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.save(); ctx.beginPath(); ctx.arc(x, y, r - 1, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = '#111827';
    for (var i = 0; i < 5; i++) {
      var a = ball.spin + i * Math.PI * 2 / 5;
      ctx.beginPath(); ctx.arc(x + Math.cos(a) * r * 0.75, y + Math.sin(a) * r * 0.75, r * 0.28, 0, Math.PI * 2); ctx.fill();
    }
    ctx.beginPath(); ctx.arc(x, y, r * 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawHUD() {
    var topY = Math.max(10, safeTop + 8);
    // score panel
    var pw = 210, ph = 46, px = CW / 2 - pw / 2;
    ctx.fillStyle = 'rgba(15,10,30,0.8)'; roundRectS(px, topY, pw, ph, 14); ctx.fill();
    ctx.fillStyle = TEAM_COLORS[0].main; roundRectS(px + 6, topY + 6, 56, ph - 12, 10); ctx.fill();
    ctx.fillStyle = TEAM_COLORS[1].main; roundRectS(px + pw - 62, topY + 6, 56, ph - 12, 10); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '900 24px system-ui, sans-serif';
    ctx.fillText(String(score[0]), px + 34, topY + ph / 2 + 1);
    ctx.fillText(String(score[1]), px + pw - 34, topY + ph / 2 + 1);
    ctx.font = '800 18px system-ui, sans-serif';
    var tl = suddenDeath ? 'שער זהב' : (Math.floor(timeLeft / 60) + ':' + ('0' + Math.floor(timeLeft % 60)).slice(-2));
    ctx.fillStyle = (!suddenDeath && timeLeft < 15) ? '#fca5a5' : '#fde68a';
    ctx.fillText(tl, CW / 2, topY + ph / 2 + 1);

    // banner
    if (bannerTime > 0 && banner) {
      var al = Math.min(1, bannerTime * 3);
      ctx.globalAlpha = al;
      ctx.font = '900 ' + Math.round(Math.min(46, CW * 0.11)) + 'px system-ui, sans-serif';
      ctx.lineWidth = 7; ctx.strokeStyle = '#1e1b4b'; ctx.strokeText(banner, CW / 2, CH * 0.42);
      ctx.fillStyle = '#facc15'; ctx.fillText(banner, CW / 2, CH * 0.42);
      ctx.globalAlpha = 1;
    }
    if (state === 'play' && pauseTimer > 0 && !bannerTime) {
      ctx.font = '900 40px system-ui, sans-serif'; ctx.fillStyle = '#fff';
      ctx.fillText(String(Math.ceil(pauseTimer)), CW / 2, CH * 0.42);
    }

    if (state !== 'play' && state !== 'goal' && state !== 'ending') return;
    // joystick
    if (input.joy) {
      ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(input.joy.sx, input.joy.sy, 55, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      var jx = input.joy.x, jy = input.joy.y, jd = len(jx - input.joy.sx, jy - input.joy.sy);
      if (jd > 55) { jx = input.joy.sx + (jx - input.joy.sx) / jd * 55; jy = input.joy.sy + (jy - input.joy.sy) / jd * 55; }
      ctx.beginPath(); ctx.arc(jx, jy, 24, 0, Math.PI * 2); ctx.fill();
    } else if (now < 12) {
      ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.font = '600 13px system-ui, sans-serif';
      ctx.fillText('גרור כאן כדי לזוז', CW * 0.25, CH - 40);
    }
    // buttons
    var b = btnLayout();
    var hasBall = ball.owner === me;
    drawButton(b.atk, hasBall ? '#22c55e' : '#ef4444', hasBall ? '⚽' : '✸', 1, input.atk);
    drawButton(b.sup, me.superC >= 1 ? '#facc15' : '#57534e', '★', me.superC, input.sup);
  }

  function drawButton(btn, color, icon, charge, active) {
    var x = btn.x, y = btn.y, r = btn.r;
    if (active && active.aim) { x = active.sx; y = active.sy; }
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.arc(x, y + 4, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = color; ctx.globalAlpha = active ? 1 : 0.88;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 3; ctx.stroke();
    if (charge < 1) {
      ctx.strokeStyle = '#facc15'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(x, y, r + 5, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * charge); ctx.stroke();
    }
    ctx.fillStyle = '#fff'; ctx.font = '900 ' + Math.round(r * 0.9) + 'px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(icon, x, y + 2);
    if (active && active.aim) {
      var d = norm(active.x - active.sx, active.y - active.sy);
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath(); ctx.arc(x + d.x * r * 0.75, y + d.y * r * 0.75, r * 0.3, 0, Math.PI * 2); ctx.fill();
    }
  }
  function roundRectS(x, y, w, h, r) { roundRect(x, y, w, h, r); }

  // ---------- Loop ----------
  var last = performance.now();
  function frame(t) {
    var dt = Math.min(0.05, (t - last) / 1000); last = t;
    update(dt);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.textBaseline = 'alphabetic';
    drawField();
    ctx.restore();
    if (players.length) drawPlayers();
    if (state !== 'menu' && players.length) drawHUD();
    requestAnimationFrame(frame);
  }

  // ---------- Screens ----------
  function show(id) {
    ['menu', 'pause', 'over'].forEach(function (s) { document.getElementById(s).classList.toggle('hidden', s !== id); });
    document.getElementById('exitBtn').classList.toggle('hidden', id !== null);
  }
  function startGame() {
    newMatch(); state = 'play'; show(null);
    beep(660, 0.08, 'square', 0.04);
  }
  function pauseGame() { if (state === 'play') { state = 'paused'; show('pause'); } }
  function postToHost(msg) {
    try { if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(msg); } catch (e) {}
    try { if (window.parent && window.parent !== window) window.parent.postMessage(msg, '*'); } catch (e) {}
  }

  function buildCards() {
    var wrap = document.getElementById('cards');
    TYPE_KEYS.forEach(function (key) {
      var t = TYPES[key];
      var card = document.createElement('div');
      card.className = 'card' + (key === chosen ? ' sel' : '');
      var c = document.createElement('canvas'); c.width = 128; c.height = 128;
      var cc = c.getContext('2d'); cc.scale(2, 2);
      drawBrawler(cc, { team: 0, type: key, t: t }, 32, 36, 18, 0, 0.6, 0, 0);
      card.appendChild(c);
      var b = document.createElement('b'); b.textContent = t.name; card.appendChild(b);
      var s = document.createElement('small'); s.textContent = t.desc; card.appendChild(s);
      var st = document.createElement('div'); st.className = 'stats';
      st.textContent = '❤ ' + t.hp + ' · 💥 ' + t.dmg * t.pellets;
      card.appendChild(st);
      card.addEventListener('click', function () {
        chosen = key;
        Array.prototype.forEach.call(wrap.children, function (el) { el.classList.remove('sel'); });
        card.classList.add('sel');
        beep(500, 0.05, 'triangle', 0.04);
      });
      wrap.appendChild(card);
    });
  }

  document.getElementById('playBtn').onclick = startGame;
  document.getElementById('againBtn').onclick = startGame;
  document.getElementById('menuBtn').onclick = function () { state = 'menu'; players = []; show('menu'); };
  document.getElementById('quitBtn').onclick = function () { state = 'menu'; players = []; show('menu'); };
  document.getElementById('resumeBtn').onclick = function () { state = 'play'; show(null); last = performance.now(); };
  document.getElementById('exitBtn').onclick = pauseGame;
  document.getElementById('menuExit').onclick = function () { postToHost('exit'); };
  document.addEventListener('visibilitychange', function () { if (document.hidden) pauseGame(); });

  buildCards();
  show('menu');
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
